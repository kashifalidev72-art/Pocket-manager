<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pocket Manager</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    padding: 25px 15px;
}

.container {
    max-width: 900px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    font-size: 40px;
}

header p {
    color: #94a3b8;
    margin-top: 8px;
}

/* DASHBOARD */

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
}

.stat h3 {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat p {
    font-size: 25px;
    font-weight: bold;
}

/* CARDS */

.card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
}

.card h2 {
    margin-bottom: 18px;
}

/* FORM */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 9px;
    background: #1e293b;
    color: white;
    font-size: 15px;
}

.full {
    grid-column: 1 / -1;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn {
    background: #22c55e;
    color: white;
}

.add-btn:hover {
    background: #16a34a;
}

/* FILTER */

.filter-row {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 10px;
    margin-bottom: 15px;
}

/* TRANSACTIONS */

.transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
}

.transaction-info {
    flex: 1;
}

.transaction-title {
    font-weight: bold;
    font-size: 17px;
}

.transaction-category {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 5px;
}

.amount {
    font-weight: bold;
    font-size: 17px;
}

.income {
    color: #22c55e;
}

.expense {
    color: #ef4444;
}

.delete-btn {
    background: #ef4444;
    color: white;
    padding: 8px 12px;
}

.delete-btn:hover {
    background: #dc2626;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 25px;
}

/* CATEGORY SUMMARY */

.category-item {
    margin-bottom: 15px;
}

.category-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
}

.bar-background {
    height: 8px;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
}

.bar {
    height: 100%;
    background: #3b82f6;
}

/* MOBILE */

@media (max-width: 650px) {

    header h1 {
        font-size: 32px;
    }

    .dashboard {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .filter-row {
        grid-template-columns: 1fr;
    }

    .transaction {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>💰 Pocket Manager</h1>
    <p>Track your money. Understand your spending.</p>
</header>


<!-- DASHBOARD -->

<div class="dashboard">

    <div class="stat">
        <h3>Total Income</h3>
        <p id="income">Rs. 0</p>
    </div>

    <div class="stat">
        <h3>Total Expenses</h3>
        <p id="expenses">Rs. 0</p>
    </div>

    <div class="stat">
        <h3>Balance</h3>
        <p id="balance">Rs. 0</p>
    </div>

</div>


<!-- ADD TRANSACTION -->

<div class="card">

<h2>➕ Add Transaction</h2>

<div class="form-grid">

    <input
        type="text"
        id="description"
        placeholder="Description e.g. Pocket Money"
    >

    <input
        type="number"
        id="amount"
        placeholder="Amount"
        min="1"
    >

    <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
    </select>

    <select id="category">
        <option value="Pocket Money">Pocket Money</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Education">Education</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
    </select>

    <button
        class="add-btn full"
        onclick="addTransaction()"
    >
        Add Transaction
    </button>

</div>

</div>


<!-- TRANSACTIONS -->

<div class="card">

<h2>📋 Transactions</h2>

<div class="filter-row">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search transactions..."
        oninput="displayTransactions()"
    >

    <select
        id="filter"
        onchange="displayTransactions()"
    >
        <option value="all">All</option>
        <option value="income">Income</option>
        <option value="expense">Expenses</option>
    </select>

</div>

<div id="transactions"></div>

</div>


<!-- CATEGORY SUMMARY -->

<div class="card">

<h2>📊 Spending by Category</h2>

<div id="categorySummary"></div>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let transactions =
JSON.parse(localStorage.getItem("pocketTransactions")) || [];


/* =========================
   SAVE
========================= */

function saveData() {

    localStorage.setItem(
        "pocketTransactions",
        JSON.stringify(transactions)
    );

}


/* =========================
   ADD TRANSACTION
========================= */

function addTransaction() {

    const description =
    document.getElementById("description").value.trim();

    const amount =
    Number(document.getElementById("amount").value);

    const type =
    document.getElementById("type").value;

    const category =
    document.getElementById("category").value;


    if (description === "") {

        alert("Please enter a description.");

        return;
    }


    if (amount <= 0) {

        alert("Please enter a valid amount.");

        return;
    }


    const transaction = {

        id: Date.now(),

        description: description,

        amount: amount,

        type: type,

        category: category

    };


    transactions.push(transaction);

    saveData();


    document.getElementById("description").value = "";

    document.getElementById("amount").value = "";


    displayTransactions();

    updateDashboard();

    displayCategories();

}


/* =========================
   DISPLAY TRANSACTIONS
========================= */

function displayTransactions() {

    const container =
    document.getElementById("transactions");

    const search =
    document.getElementById("search").value.toLowerCase();

    const filter =
    document.getElementById("filter").value;


    container.innerHTML = "";


    let filtered =
    transactions.filter(transaction => {

        const matchesSearch =
        transaction.description
        .toLowerCase()
        .includes(search);


        const matchesFilter =
        filter === "all" ||
        transaction.type === filter;


        return matchesSearch && matchesFilter;

    });


    if (filtered.length === 0) {

        container.innerHTML =
        '<div class="empty">No transactions found.</div>';

        return;
    }


    filtered
    .slice()
    .reverse()
    .forEach(transaction => {

        const div =
        document.createElement("div");

        div.className = "transaction";


        const sign =
        transaction.type === "income"
        ? "+"
        : "-";


        div.innerHTML = `

            <div class="transaction-info">

                <div class="transaction-title">
                    ${transaction.description}
                </div>

                <div class="transaction-category">
                    ${transaction.category}
                </div>

            </div>

            <div
                class="amount ${
                    transaction.type === "income"
                    ? "income"
                    : "expense"
                }"
            >
                ${sign} Rs. ${transaction.amount}
            </div>

            <button
                class="delete-btn"
                onclick="deleteTransaction(${transaction.id})"
            >
                Delete
            </button>

        `;


        container.appendChild(div);

    });

}


/* =========================
   DELETE
========================= */

function deleteTransaction(id) {

    transactions =
    transactions.filter(
        transaction => transaction.id !== id
    );


    saveData();

    displayTransactions();

    updateDashboard();

    displayCategories();

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard() {

    let income = 0;

    let expenses = 0;


    transactions.forEach(transaction => {

        if (transaction.type === "income") {

            income += transaction.amount;

        } else {

            expenses += transaction.amount;

        }

    });


    const balance =
    income - expenses;


    document.getElementById("income").textContent =
    "Rs. " + income;


    document.getElementById("expenses").textContent =
    "Rs. " + expenses;


    document.getElementById("balance").textContent =
    "Rs. " + balance;

}


/* =========================
   CATEGORY SUMMARY
========================= */

function displayCategories() {

    const container =
    document.getElementById("categorySummary");


    container.innerHTML = "";


    let categories = {};


    transactions.forEach(transaction => {

        if (transaction.type !== "expense") {
            return;
        }


        if (!categories[transaction.category]) {

            categories[transaction.category] = 0;

        }


        categories[transaction.category] +=
        transaction.amount;

    });


    const values =
    Object.values(categories);


    if (values.length === 0) {

        container.innerHTML =
        '<div class="empty">No expenses yet.</div>';

        return;
    }


    const highest =
    Math.max(...values);


    Object.keys(categories).forEach(category => {

        const amount =
        categories[category];


        const percentage =
        (amount / highest) * 100;


        const div =
        document.createElement("div");

        div.className = "category-item";


        div.innerHTML = `

            <div class="category-top">

                <span>${category}</span>

                <span>Rs. ${amount}</span>

            </div>

            <div class="bar-background">

                <div
                    class="bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        `;


        container.appendChild(div);

    });

}


/* =========================
   START APP
========================= */

displayTransactions();

updateDashboard();

displayCategories();

</script>

</body>
</html>
